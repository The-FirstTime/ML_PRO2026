[project]
name = "spam-service"
version = "0.3.0"
description = "_"
requires-python=">=3.11, <3.13"

dependencies = [
"fastapi",
"uvicorn",
"pydantic",
"pydantic-settings",
"pandas",
"scikit-learn>=1.6,<1.7",
"joblib",
"psycopg[binary]"
]


[dependency-groups]
dev = [
"pytest",
"httpx",
"locust",
"ruff",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spam"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужна база данных - адрес в DATABASE_URL"]

[tool.ruff]
line-length = 128


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

